services:
  - type: web
    name: lafavape
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: PASSWORD_HASH
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: MAIL_FROM
        sync: false
      - key: MAIL_TO
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
